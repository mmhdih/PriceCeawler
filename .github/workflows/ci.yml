name: تست‌ها

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: تست روی ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: اجرای تست‌ها
        run: python -m unittest discover -s tests -t . -v

  build:
    name: ساخت آزمایشی نسخه پرتابل ویندوز
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # جدا نگه داشتن این دو گام عمدی است: PowerShell با شکست یک دستور native
      # متوقف نمی‌شود و اگر در یک بلوک باشند، خطای اولی نادیده گرفته می‌شود.
      - name: ساخت اطلاعات نسخه ویندوز
        run: python scripts/version_info.py

      - name: اجرای PyInstaller
        run: pyinstaller --clean --noconfirm PriceCeawler.spec

      - name: بررسی سلامت فایل ساخته‌شده
        shell: pwsh
        run: |
          # doctor بررسی می‌کند که موتور اکسل واقعاً داخل فایل اجرایی بسته‌بندی شده باشد
          & dist/PriceCeawler.exe doctor --offline
          if ($LASTEXITCODE -ne 0) { throw "بررسی سلامت (doctor) ناموفق بود." }

          $proc = Start-Process -FilePath dist/PriceCeawler.exe `
            -ArgumentList '--no-browser', '--port', '8799' -PassThru
          try {
            $ok = $false
            foreach ($attempt in 1..30) {
              Start-Sleep -Seconds 2
              try {
                if ((Invoke-RestMethod 'http://127.0.0.1:8799/health' -TimeoutSec 5).ok) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "سرور محلی بالا نیامد." }
            Write-Host "✔ فایل اجرایی سالم است."
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-preview
          path: dist/PriceCeawler.exe
          if-no-files-found: error
          retention-days: 7

  wordpress-plugin-tests:
    name: تست افزونه وردپرس (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mbstring, json, curl

      - name: تولید داده مرجع تقویم شمسی از نسخه پایتون تأییدشده
        run: |
          python3 - <<'PY' > /tmp/jalali_fixtures.json
          import json, random, datetime as dt
          from priceceawler.jalali import gregorian_to_jalali

          random.seed(42)
          pairs = []
          for _ in range(2000):
              o = random.randint(dt.date(1300, 1, 1).toordinal(), dt.date(2200, 1, 1).toordinal())
              g = dt.date.fromordinal(o)
              j = gregorian_to_jalali(g.year, g.month, g.day)
              pairs.append({"g": [g.year, g.month, g.day], "j": list(j)})
          print(json.dumps(pairs))
          PY

      - name: اجرای تست‌های PHP
        working-directory: wordpress-plugin/goldcrawler/tests
        run: |
          set -euo pipefail
          php test-jalali.php /tmp/jalali_fixtures.json
          for f in test-tgju.php test-report.php test-xlsx.php test-storage.php test-crawler.php test-license.php test-admin.php test-meta-contract.php test-ajax.php test-bootstrap.php; do
            echo "--- $f ---"
            php "$f"
          done

      - name: بسته‌بندی افزونه و بررسی سلامت zip
        run: |
          cd wordpress-plugin
          zip -r -q goldcrawler.zip goldcrawler -x "goldcrawler/tests/*"
          php -r '$z = new ZipArchive(); if ($z->open("goldcrawler.zip") !== true) { fwrite(STDERR, "invalid zip\n"); exit(1); } if ($z->locateName("goldcrawler/goldcrawler.php") === false) { fwrite(STDERR, "missing main plugin file\n"); exit(1); } echo "zip ok, " . $z->numFiles . " files\n";'

      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: goldcrawler-wordpress-plugin
          path: wordpress-plugin/goldcrawler.zip
          if-no-files-found: error
          retention-days: 14
