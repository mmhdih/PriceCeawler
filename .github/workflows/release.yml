name: انتشار نسخه پرتابل

# با هر تغییر شماره نسخه در priceceawler/version.py، فایل پرتابل ویندوز
# ساخته و به‌صورت یک Release منتشر می‌شود.
on:
  push:
    branches: [main]
    paths:
      - 'priceceawler/**'
      - 'run.py'
      - 'PriceCeawler.spec'
      - 'requirements*.txt'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'ساخت و انتشار حتی اگر تگ این نسخه از قبل وجود داشته باشد'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── ۱) آیا شماره نسخه تغییر کرده است؟ ────────────────────────────────
  check:
    name: بررسی نسخه
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      should_release: ${{ steps.read.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: read
        name: خواندن نسخه و مقایسه با تگ‌های موجود
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' priceceawler/version.py)"
          if [ -z "$version" ]; then
            echo "::error file=priceceawler/version.py::__version__ پیدا نشد."
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$'; then
            echo "::error file=priceceawler/version.py::قالب نسخه نامعتبر است: $version"
            exit 1
          fi

          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            exists=true
          else
            exists=false
          fi

          if [ "$exists" = "false" ] || [ "${{ inputs.force }}" = "true" ]; then
            should_release=true
          else
            should_release=false
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"

          echo "### نسخه: \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$should_release" = "true" ]; then
            echo "تگ \`$tag\` وجود ندارد — نسخه پرتابل ساخته و منتشر می‌شود." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "تگ \`$tag\` از قبل منتشر شده است — کاری انجام نمی‌شود." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── ۲) تست‌ها ────────────────────────────────────────────────────────
  test:
    name: تست‌ها
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  # ── ۳) ساخت فایل پرتابل ویندوز ───────────────────────────────────────
  build:
    name: ساخت PriceCeawler.exe
    needs: [check, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ساخت اطلاعات نسخه ویندوز
        run: python scripts/version_info.py

      - name: اجرای PyInstaller
        run: pyinstaller --clean --noconfirm PriceCeawler.spec

      - name: بررسی سلامت فایل ساخته‌شده
        shell: pwsh
        run: |
          $exe = "dist/PriceCeawler.exe"
          if (-not (Test-Path $exe)) { throw "فایل اجرایی ساخته نشد." }

          # ۱) خط فرمان پاسخ می‌دهد؟
          $reported = & $exe --version
          Write-Host "نسخه گزارش‌شده: $reported"
          if ($reported -notmatch '${{ needs.check.outputs.version }}') {
            throw "نسخه فایل اجرایی با version.py هم‌خوانی ندارد."
          }

          # ۲) موتور اکسل و پوشه داده‌ها سالم‌اند؟
          & $exe doctor --offline
          if ($LASTEXITCODE -ne 0) { throw "بررسی سلامت (doctor) ناموفق بود." }

          # ۳) سرور محلی بالا می‌آید و رابط کاربری سرو می‌شود؟
          $proc = Start-Process -FilePath $exe `
            -ArgumentList '--no-browser', '--port', '8799' -PassThru
          try {
            $ok = $false
            foreach ($attempt in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:8799/health' -TimeoutSec 5
                if ($health.ok) {
                  $page = Invoke-WebRequest 'http://127.0.0.1:8799/' -UseBasicParsing -TimeoutSec 5
                  if ($page.Content -notmatch 'Vazirmatn|کراولر قیمت') { throw "رابط کاربری سرو نشد." }
                  $font = Invoke-WebRequest 'http://127.0.0.1:8799/assets/fonts/Vazirmatn-Regular.woff2' `
                    -UseBasicParsing -TimeoutSec 5
                  if ($font.RawContentLength -lt 1000) { throw "فونت Vazirmatn داخل فایل اجرایی نیست." }
                  $ok = $true
                  break
                }
              } catch { }
            }
            if (-not $ok) { throw "سرور محلی در ۶۰ ثانیه بالا نیامد." }
            Write-Host "✔ سرور محلی، رابط کاربری و فونت Vazirmatn سالم هستند."
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: نام‌گذاری و ساخت چک‌سام
        shell: pwsh
        run: |
          $name = "PriceCeawler-${{ needs.check.outputs.tag }}-windows-x64.exe"
          Move-Item dist/PriceCeawler.exe "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "dist/$name.sha256" -Encoding ascii
          $size = [math]::Round((Get-Item "dist/$name").Length / 1MB, 1)
          "ASSET_NAME=$name"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ASSET_SIZE=$size"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ASSET_SHA=$hash"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: خلاصه ساخت
        shell: bash
        run: |
          {
            echo "### فایل پرتابل ساخته شد"
            echo ""
            echo "| مورد | مقدار |"
            echo "| --- | --- |"
            echo "| نام فایل | \`$ASSET_NAME\` |"
            echo "| حجم | ${ASSET_SIZE} مگابایت |"
            echo "| SHA-256 | \`$ASSET_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── ۴) انتشار Release ────────────────────────────────────────────────
  release:
    name: انتشار ${{ needs.check.outputs.tag }}
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: dist

      - name: نوشتن متن انتشار
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          previous="$(git tag --list 'v*' --sort=-version:refname | head -n 1 || true)"

          {
            echo "## کراولر قیمت — نسخه $version"
            echo ""
            echo "گزارش روزانه قیمت طلا، سکه، ارز و رمزارز از **TGJU** با رابط کاربری فارسی."
            echo ""
            echo "### دریافت"
            echo ""
            echo "فایل \`PriceCeawler-v$version-windows-x64.exe\` را دانلود و اجرا کنید."
            echo "برنامه به نصب نیاز ندارد؛ رابط کاربری در مرورگر پیش‌فرض شما باز می‌شود و"
            echo "تنظیمات و آرشیو در پوشه \`PriceCeawler-Data\` کنار همان فایل ذخیره می‌شود."
            echo ""
            echo "درستی فایل را می‌توانید با \`.sha256\` همراه آن بررسی کنید."
            echo ""
            echo "### تغییرات"
            echo ""
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "$previous..HEAD" | head -n 40
            else
              git log --no-merges --pretty='- %s' | head -n 40
            fi
          } > release-notes.md
          cat release-notes.md

      - name: ساخت Release و بارگذاری فایل‌ها
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" dist/* \
              --title "کراولر قیمت $tag" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
          echo "### [$tag](${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag) منتشر شد" \
            >> "$GITHUB_STEP_SUMMARY"
